name: Turborepo and tsops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: monorepo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    runs-on: ubuntu-latest
    env:
      # Optional Turborepo remote-cache credentials.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build affected packages through Turborepo
        run: pnpm turbo run build --filter="[${{ steps.base.outputs.ref }}]"

      - name: Test affected packages through Turborepo
        run: pnpm turbo run test --filter="[${{ steps.base.outputs.ref }}]"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build affected application images through tsops
        run: >-
          pnpm tsops build
          --filter "${{ steps.base.outputs.ref }}"
          --source-key

      - name: Explain the split
        run: |
          cat <<'EOF'
          Turborepo selects and caches package tasks.
          tsops selects containerized applications from their build inputs,
          reuses exact source-key images, and returns deployable image identity.
          They share Git history but do not duplicate each other's cache layer.
          EOF
